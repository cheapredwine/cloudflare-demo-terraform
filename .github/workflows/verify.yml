# Verify workflow for the Cloudflare Demo Platform.
# Runs the `make verify` targets one step at a time: no secrets required.

name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (a tag can be moved; a SHA can't).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # CI never pushes; don't leave git creds on the runner

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1

      - name: Install shfmt (so lint matches make verify)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shfmt

      # Each step is one `make verify` target, so CI and local runs can't drift.
      - name: Lint (shellcheck, shfmt, JS/Python syntax)
        run: make lint

      - name: Config-content guards
        run: make config-checks

      - name: terraform fmt -check
        run: make fmt

      - name: terraform init (provider download)
        # -lockfile=readonly: fail instead of silently changing the lock file
        run: terraform init -backend=false -lockfile=readonly

      - name: terraform validate
        run: make validate

      - name: terraform test (mocked, offline)
        run: make tftest
